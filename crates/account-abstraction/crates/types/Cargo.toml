[package]
name = "aa-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[dependencies]

alloy-eips = "1.0"
alloy-primitives = "1.0"
alloy-sol-types = "1.0"

anyhow = "1.0"
async-trait = "0.1"
auto_impl = "1.2"
chrono = "0.4.38"
futures-util = "0.3"
metrics = "0.24"
metrics-derive = "0.1"

mockall = { version = "0.13", optional = true }
num_enum = "0.7.3"
parse-display = "0.10"
aa-contracts = { path = "../contracts" }
aa-utils = { path = "../utils" }
serde = { version = "1.0", features = ["derive"] }
strum = { version = "0.26", features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
alloy-primitives = { version = "1.0" }
serde_json = "1.0"

[features]
test-utils = ["mockall"]
