[package]
name = "aa-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[dependencies]

alloy-consensus = "1.0"
alloy-contract = "1.0"
alloy-eips = "1.0"
alloy-json-rpc = "1.0"
alloy-network = "1.0"
alloy-primitives = { version = "1.0", features = ["rand"] }
alloy-provider = { version = "1.0", features = ["debug-api"] }
alloy-rlp = "0.3"
alloy-rpc-client = "1.0"
alloy-rpc-types-any = "1.0"
alloy-rpc-types-eth = "1.0"
alloy-rpc-types-trace = "1.0"
alloy-serde = "1.0"
alloy-sol-types = "1.0"
alloy-transport = "1.0"

anyhow = "1.0"
async-trait = "0.1"
auto_impl = "1.2"
futures-util = "0.3"
metrics = "0.24"
metrics-derive = "0.1"
mockall = { version = "0.13", optional = true }
moka = { version = "0.12.11", features = ["future"] }
pin-project = "1.1"
rand = "0.8"
reth-tasks = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.2", features = ["rayon"] }
# rundler-bindings-fastlz = { path = "../bindings-fastlz" }
aa-contracts = { path = "../contracts" }
aa-types = { path = "../types" }
aa-utils = { path = "../utils" }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tracing = "0.1"
url = "2.5"

[features]
test-utils = ["mockall"]

[dev-dependencies]
alloy-provider = { version = "1.0", features = ["debug-api"] }
tiny_http = "0.12"
tokio = { version = "1", features = ["full"] }
