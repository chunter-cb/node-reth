[package]
name = "aa-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[dependencies]

alloy-primitives = "1.0"
alloy-sol-types = "1.0"

anyhow = "1.0"
arrayvec = "0.7.6"
async-trait = "0.1"
futures-util = "0.3"
metrics = "0.24"
metrics-derive = "0.1"
mockall = { version = "0.13", optional = true }
aa-contracts = { path = "../contracts" }
aa-provider = { path = "../provider" }
aa-types = { path = "../types" }
aa-utils = { path = "../utils" }
serde = { version = "1.0", features = ["derive"] }
serde_with = "3.9.0"
thiserror = "1.0"
tokio = { version = "1.0" }
tracing = "0.1"

[dev-dependencies]
alloy-json-rpc = "1.0"
alloy-primitives = { version = "1.0" }
alloy-transport = "1.0"
mockall = "0.13"
aa-provider = { path = "../provider", features = ["test-utils"] }
aa-types = { path = "../types" }
serde_json = "1.0"

[features]
test-utils = ["mockall"]
