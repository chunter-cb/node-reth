[package]
name = "aa-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[dependencies]
alloy-consensus = "1.0"
alloy-contract = "1.0"
alloy-json-rpc = "1.0"
alloy-primitives = { version = "1.0", features = ["rand"] }
alloy-sol-types = "1.0"
anyhow = "1.0"
async-trait = "0.1"
futures-util = "0.3"
jsonrpsee = { version = "0.26.0", features = ["client", "macros", "server"] }
jsonrpsee-types = "0.26.0"
metrics = "0.24"
metrics-derive = "0.1"
parse-display = "0.10"
pin-project = "1.1"
aa-provider = { path = "../provider" }
aa-sim = { path = "../sim" }
aa-task = { path = "../task" }
aa-types = { path = "../types" }
aa-utils = { path = "../utils" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.26", features = ["derive"] }
thiserror = "1.0"
tonic = "0.12"
tower = "0.5"
tower-http = { version = "0.6.2", features = ["cors"] }
tracing = "0.1"

[dependencies.mockall]
version = "0.13"
optional = true

[dev-dependencies]
alloy-consensus = "1.0"
alloy-rpc-types-eth = "1.0"
aa-provider = { path = "../provider", features = ["test-utils"] }
aa-sim = { path = "../sim", features = ["test-utils"] }
aa-types = { path = "../types", features = ["test-utils"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros"] }

[features]
test-utils = ["mockall", "aa-provider/test-utils", "aa-sim/test-utils", "aa-types/test-utils"]